<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>每日营养计算器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #10b981;
    --p: #3b82f6;
    --f: #f59e0b;
    --c: #8b5cf6;
    --k: #ef4444;
    --over: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: 8px 10px;
    gap: 8px;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .header h1 {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .mode-switch {
    display: flex;
    background: var(--card);
    border-radius: 8px;
    padding: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .mode-switch button {
    border: 0;
    background: transparent;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 6px;
  }
  .mode-switch button.active {
    background: var(--ink);
    color: #fff;
  }
  .weight-input {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 8px;
    padding: 5px 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    font-size: 12px;
    color: var(--muted);
  }
  .weight-input input {
    width: 36px;
    border: 0;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    padding: 0 2px;
  }
  .weight-input input:focus { outline: none; }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--card);
    border-radius: 10px;
    padding: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    flex-shrink: 0;
  }
  .tabs button {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 8px 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 8px;
    position: relative;
  }
  .tabs button.active {
    background: var(--ink);
    color: #fff;
  }
  .tabs button .dot {
    display: inline-block;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    margin-left: 4px;
    padding: 0 4px;
  }
  .tabs button:not(.active) .dot { background: var(--accent); }

  /* Food list */
  .foods {
    flex: 1;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .add-btn {
    width: 100%;
    border: 1px dashed #cbd5e1;
    background: var(--bg);
    color: var(--muted);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .add-btn.open {
    background: var(--ink);
    color: #fff;
    border-style: solid;
    border-color: var(--ink);
  }
  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .picker.hidden { display: none; }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12px;
    line-height: 1.2;
  }
  .chip.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 0;
    font-size: 13px;
  }
  .food {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    gap: 8px;
  }
  .food:last-child { border-bottom: 0; }
  .food .info {
    flex: 1;
    min-width: 0;
  }
  .food .name {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .food .macro {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .stepper button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 50%;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .stepper button:active { background: var(--bg); }
  .stepper button.minus { color: var(--muted); }
  .stepper .count {
    min-width: 28px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stepper.zero .count { color: var(--muted); font-weight: 400; }
  .stepper.zero button.minus { opacity: .35; }

  /* Result */
  .result {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }
  .metric {
    background: var(--card);
    border-radius: 10px;
    padding: 8px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    text-align: center;
  }
  .metric .label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .metric .val {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .metric .target {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width .35s ease;
  }
  .metric[data-k=p] .label, .metric[data-k=p] .val { color: var(--p); }
  .metric[data-k=p] .bar > div { background: var(--p); }
  .metric[data-k=f] .label, .metric[data-k=f] .val { color: var(--f); }
  .metric[data-k=f] .bar > div { background: var(--f); }
  .metric[data-k=c] .label, .metric[data-k=c] .val { color: var(--c); }
  .metric[data-k=c] .bar > div { background: var(--c); }
  .metric[data-k=k] .label, .metric[data-k=k] .val { color: var(--k); }
  .metric[data-k=k] .bar > div { background: var(--k); }
  .metric.over .bar > div { background: var(--over) !important; }
  .metric.over .val { color: var(--over) !important; }

  .calc-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(15,23,42,.2);
  }
  .calc-btn:active { transform: scale(.98); }
</style>
</head>
<body>

<div class="header">
  <h1>营养计算器</h1>
  <div class="mode-switch" id="modeSwitch">
    <button class="active" data-mode="bulk">增肌</button>
    <button data-mode="cut">减脂</button>
  </div>
  <div class="weight-input">
    <input type="number" id="weight" value="65" min="30" max="200" inputmode="decimal">
    <span>kg</span>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="foods" id="foods"></div>

<div class="result">
  <div class="metric" data-k="p">
    <div class="label">蛋白</div>
    <div class="val" id="aP">0</div>
    <div class="target">/ <span id="tP">0</span>g</div>
    <div class="bar"><div id="bP"></div></div>
  </div>
  <div class="metric" data-k="f">
    <div class="label">脂肪</div>
    <div class="val" id="aF">0</div>
    <div class="target">/ <span id="tF">0</span>g</div>
    <div class="bar"><div id="bF"></div></div>
  </div>
  <div class="metric" data-k="c">
    <div class="label">碳水</div>
    <div class="val" id="aC">0</div>
    <div class="target">/ <span id="tC">0</span>g</div>
    <div class="bar"><div id="bC"></div></div>
  </div>
  <div class="metric" data-k="k">
    <div class="label">热量</div>
    <div class="val" id="aK">0</div>
    <div class="target">/ <span id="tK">0</span></div>
    <div class="bar"><div id="bK"></div></div>
  </div>
</div>

<button class="calc-btn" id="calcBtn">计算今日摄入</button>

<script>
  const FOODS = {
    rice:        { name: '米饭一碗',         p: 4,   f: 0.5, c: 35 },
    noodle:      { name: '面条一碗(熟)',     p: 7,   f: 1,   c: 38 },
    sweetPotato: { name: '红薯 100g',        p: 1.6, f: 0.2, c: 20 },
    oat:         { name: '燕麦 50g (干)',    p: 7,   f: 3,   c: 33 },
    bread:       { name: '全麦面包 1 片',    p: 4,   f: 1.5, c: 18 },
    chicken:     { name: '生鲜鸡胸 100g',    p: 23,  f: 1.5, c: 0  },
    egg:         { name: '鸡蛋 1 个',        p: 6,   f: 5,   c: 0.5},
    eggWhite:    { name: '蛋白 1 个',        p: 4,   f: 0,   c: 0.3},
    beef:        { name: '瘦牛肉 100g',      p: 20,  f: 5,   c: 0  },
    salmon:      { name: '三文鱼 100g',      p: 20,  f: 13,  c: 0  },
    veggie:      { name: '蔬菜 200g',        p: 4,   f: 0.4, c: 8  },
    milk:        { name: '牛奶 250ml',       p: 8,   f: 8,   c: 12 },
    banana:      { name: '香蕉 1 根',        p: 1.3, f: 0.3, c: 27 },
    apple:       { name: '苹果 1 个',        p: 0.3, f: 0.2, c: 25 },
    nuts:        { name: '坚果 30g',         p: 6,   f: 18,  c: 6  },
    powder:      { name: '蛋白粉 1 勺',      p: 24,  f: 1,   c: 2  },
    mantou:      { name: '馒头 1 个',        p: 7,   f: 1.1, c: 47 },
    soymilk:     { name: '豆浆 250ml',       p: 7.5, f: 4,   c: 3  },
  };

  const MEALS = [
    { id: 'breakfast',   name: '早餐',  items: ['mantou','soymilk','oat','egg','eggWhite','milk','bread','banana'] },
    { id: 'lunch',       name: '午餐',  items: ['rice','chicken','beef','veggie','sweetPotato','egg'] },
    { id: 'dinner',      name: '晚餐',  items: ['rice','chicken','salmon','eggWhite','veggie','noodle'] },
    { id: 'postworkout', name: '练后餐',items: ['powder','banana','milk','apple','rice','nuts'] },
  ];

  const TARGETS = {
    bulk: { p: 2.0, f: 1.0, c: 5.0 },
    cut:  { p: 2.2, f: 0.8, c: 2.5 },
  };

  const kcal = (p, f, c) => Math.round(p * 4 + c * 4 + f * 9);
  const $ = id => document.getElementById(id);

  // State: counts[mealId][foodKey] = number
  const counts = {};
  MEALS.forEach(m => {
    counts[m.id] = {};
    m.items.forEach(k => counts[m.id][k] = 0);
  });

  let activeMeal = MEALS[0].id;
  let mode = 'bulk';
  const pickerOpen = {}; // per meal
  MEALS.forEach(m => pickerOpen[m.id] = false);

  // Render tabs
  const tabsEl = $('tabs');
  MEALS.forEach((m, i) => {
    const b = document.createElement('button');
    b.dataset.meal = m.id;
    b.innerHTML = `${m.name}<span class="dot" style="display:none">0</span>`;
    if (i === 0) b.classList.add('active');
    b.addEventListener('click', () => {
      activeMeal = m.id;
      [...tabsEl.children].forEach(c => c.classList.toggle('active', c === b));
      renderFoods();
    });
    tabsEl.appendChild(b);
  });

  function renderTabDots() {
    [...tabsEl.children].forEach(b => {
      const mealId = b.dataset.meal;
      const sum = Object.values(counts[mealId]).reduce((a,b)=>a+b,0);
      const dot = b.querySelector('.dot');
      if (sum > 0) { dot.style.display = 'inline-block'; dot.textContent = sum; }
      else dot.style.display = 'none';
    });
  }

  // Render food list for active meal
  const foodsEl = $('foods');
  function renderFoods() {
    const meal = MEALS.find(m => m.id === activeMeal);
    const open = pickerOpen[activeMeal];
    const selected = meal.items.filter(k => counts[activeMeal][k] > 0);

    const pickerHtml = `<div class="picker ${open ? '' : 'hidden'}">${
      meal.items.map(key => {
        const f = FOODS[key];
        const n = counts[activeMeal][key];
        return `<button class="chip ${n>0?'on':''}" data-pick="${key}">${f.name}${n>0?` ×${n}`:''}</button>`;
      }).join('')
    }</div>`;

    const listHtml = selected.length === 0
      ? `<div class="empty">点上方「+ 添加食物」开始记录</div>`
      : selected.map(key => {
          const f = FOODS[key];
          const n = counts[activeMeal][key];
          return `<div class="food">
            <div class="info">
              <div class="name">${f.name}</div>
              <div class="macro">蛋白 ${f.p} · 脂肪 ${f.f} · 碳水 ${f.c}</div>
            </div>
            <div class="stepper" data-food="${key}">
              <button class="minus" data-act="-1">−</button>
              <span class="count">${n}</span>
              <button class="plus" data-act="1">+</button>
            </div>
          </div>`;
        }).join('');

    foodsEl.innerHTML = `
      <button class="add-btn ${open?'open':''}" id="addBtn">${open ? '收起' : '+ 添加食物'}</button>
      ${pickerHtml}
      ${listHtml}
    `;

    $('addBtn').addEventListener('click', () => {
      pickerOpen[activeMeal] = !pickerOpen[activeMeal];
      renderFoods();
    });

    foodsEl.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => {
        const key = c.dataset.pick;
        const next = Math.min(20, counts[activeMeal][key] + 1);
        counts[activeMeal][key] = next;
        renderFoods();
        renderTabDots();
      });
    });

    foodsEl.querySelectorAll('.stepper').forEach(s => {
      s.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const key = s.dataset.food;
        const delta = parseInt(btn.dataset.act);
        const next = Math.max(0, Math.min(20, counts[activeMeal][key] + delta));
        if (next === counts[activeMeal][key]) return;
        counts[activeMeal][key] = next;
        renderFoods();
        renderTabDots();
      });
    });
  }
  renderFoods();

  // Mode switch
  $('modeSwitch').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
    mode = btn.dataset.mode;
  });

  // Calculate
  function calculate() {
    const w = parseFloat($('weight').value) || 0;
    let P = 0, F = 0, C = 0;
    MEALS.forEach(m => {
      m.items.forEach(k => {
        const n = counts[m.id][k];
        if (n > 0) {
          const f = FOODS[k];
          P += f.p * n; F += f.f * n; C += f.c * n;
        }
      });
    });

    const t = TARGETS[mode];
    const tP = Math.round(t.p * w);
    const tF = Math.round(t.f * w);
    const tC = Math.round(t.c * w);
    const tK = kcal(tP, tF, tC);
    const aK = kcal(P, F, C);

    const fmt = n => Math.round(n * 10) / 10;
    $('aP').textContent = fmt(P); $('tP').textContent = tP;
    $('aF').textContent = fmt(F); $('tF').textContent = tF;
    $('aC').textContent = fmt(C); $('tC').textContent = tC;
    $('aK').textContent = aK;     $('tK').textContent = tK;

    const setBar = (id, actual, target) => {
      const pct = target ? Math.min(100, (actual / target) * 100) : 0;
      $(id).style.width = pct + '%';
      const metric = $(id).closest('.metric');
      metric.classList.toggle('over', target > 0 && actual > target * 1.1);
    };
    setBar('bP', P, tP); setBar('bF', F, tF); setBar('bC', C, tC); setBar('bK', aK, tK);
  }
  $('calcBtn').addEventListener('click', calculate);
  calculate(); // initial render of targets
</script>
</body>
</html>
