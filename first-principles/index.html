<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>第一性原理 — 思维训练卡</title>
  <style>
    :root {
      --bg: #FFF9F0;
      --primary: #1A1A2E;
      --secondary: #8A7B6E;
      --accent: #F5891E;
      --accent-light: #FFF4D6;
      --stroke: #EDE2D0;
      --surface: #FFFFFF;
      --gray: #9CA3AF;
      --shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }
    body {
      background: var(--bg);
      color: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 16px;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .app-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .app-title { font-size: 18px; font-weight: 700; color: var(--primary); }
    .app-stats { font-size: 13px; color: var(--gray); }

    .card-stack {
      position: relative;
      width: 100%;
      aspect-ratio: 0.72;
      max-height: 70dvh;
    }
    .card-stack > * { position: absolute; inset: 0; }

    .card {
      width: 100%;
      height: 100%;
      background: var(--accent-light);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      cursor: grab;
      transition: box-shadow 0.2s;
      will-change: transform;
      -webkit-overflow-scrolling: touch;
    }
    .card:active { cursor: grabbing; }

    .card.peek {
      transform: scale(0.94);
      opacity: 0.45;
      pointer-events: none;
    }

    .card-quote { padding: 18px 18px 6px; flex-shrink: 0; }
    .card-quote .quote-text { font-size: 20px; font-weight: 700; line-height: 1.45; color: var(--primary); }
    .card-quote .quote-author { font-size: 14px; color: var(--secondary); margin-top: 8px; text-align: right; }

    .card-breakdown {
      margin: 8px 14px;
      padding: 14px 16px;
      background: var(--accent);
      border-radius: 16px;
      flex-shrink: 0;
    }
    .card-breakdown .bd-label {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;
    }
    .card-breakdown .bd-steps { display: flex; flex-direction: column; gap: 4px; }
    .card-breakdown .bd-step { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.5; }

    .card-case { padding: 10px 18px; flex-shrink: 0; }
    .card-case .case-label {
      font-size: 12px; font-weight: 700; color: var(--secondary);
      letter-spacing: 0.04em; margin-bottom: 2px;
    }
    .card-case .case-text { font-size: 14px; color: var(--primary); line-height: 1.55; }

    .card-reflect { padding: 10px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
    .card-reflect .refl-label {
      font-size: 12px; font-weight: 700; color: var(--secondary);
      letter-spacing: 0.04em; margin-bottom: 2px;
    }
    .card-reflect .refl-q { font-size: 14px; color: var(--primary); display: flex; gap: 6px; align-items: flex-start; line-height: 1.5; }
    .card-reflect .refl-q .idx { font-weight: 700; color: var(--accent); flex-shrink: 0; }

    .swipe-hint { width: 100%; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
    .progress-bar { width: 100%; height: 5px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
    .progress-bar .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.35s ease; }
    .swipe-labels { display: flex; justify-content: center; gap: 10px; font-size: 11px; color: #C4C9D4; }

    .card-pos { cursor: pointer; }
    .card-pos:hover { color: var(--accent); }

    /* Category picker popover */
    .picker-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200;
      display: flex; align-items: flex-start; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .picker-overlay.show { opacity: 1; pointer-events: auto; }
    .picker-sheet {
      margin-top: 100px;
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      width: 260px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .picker-sheet button {
      padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--stroke); background: var(--surface);
      font-size: 14px; color: var(--secondary); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .picker-sheet button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="app-title">第一性原理</div>
    <div class="app-stats"><span class="card-pos" id="card-pos">1/10</span></div>
  </div>

  <div class="card-stack" id="stack">
    <div class="card peek" id="peek-card"></div>
    <div class="card" id="active-card"></div>
  </div>

  <div class="swipe-hint">
    <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
    <div class="swipe-labels">左滑下一张 &middot; 右滑上一张 &middot;  键翻卡</div>
  </div>
</div>

<div class="picker-overlay" id="picker-overlay">
  <div class="picker-sheet" id="picker-sheet"></div>
</div>

<script>
var ALL_CARDS = [
  { id: "p01", category: "哲学", catKey: "philosophy", principle: "第一性原理就是看透事物本质的方法", author: "亚里士多德", difficulty: 1,
    breakdown: ["什么是「本质」？它是事物不可再分解的元事实", "如何区分表象与本质？追问「这背后是什么」", "从元事实出发，推导出新的可能性"],
    caseStudy: "亚里士多德用「四因说」（质料因、形式因、动力因、目的因）拆解任何事物的存在理由。这是人类最早的「第一性」思维框架。",
    prompts: ["你最近一次从「大家都这么说」跳出来独立思考是什么时候？","找一个你习以为常的假设，追问三层「为什么」试试看。"] },
  { id: "p02", category: "科学", catKey: "science", principle: "如果你不能简单解释，说明你还没有真正理解", author: "理查德·费曼", difficulty: 1,
    breakdown: ["真正的理解 = 能给外行讲明白", "如果卡在某个点讲不清楚，那里就是你的知识缺口", "用简单的话重述，直到没有模糊地带"],
    caseStudy: "费曼在教量子电动力学时，要求自己能用日常语言解释每一个方程。他发现——做不到的地方，就是物理学还没搞明白的地方。",
    prompts: ["选一个你自认为「懂」的概念，试着用三句话讲给一个12岁孩子听。","哪个地方你会开始含糊？那就是你下一步该深挖的。"] },
  { id: "p03", category: "商业", catKey: "business", principle: "与其更好，不如不同", author: "Peter Thiel（《从0到1》）", difficulty: 2,
    breakdown: ["竞争是一种零和思维——大家在同一个维度卷", "第一性原理告诉你：重新定义问题，创造新维度", "垄断不是终点，它是创新的结果"],
    caseStudy: "PayPal 没有跟银行比谁更安全——它重新定义了「支付」这件事：用 email 就能转账。银行花十年才追上这个维度。",
    prompts: ["你正在做的产品/项目，正在哪个维度上跟别人卷？","如果把那个维度删掉，还能留下什么？"] },
  { id: "p04", category: "认知", catKey: "cognition", principle: "地图不是疆域", author: "Alfred Korzybski", difficulty: 1,
    breakdown: ["我们对世界的认知是一张「地图」——简化、抽象、带有偏见", "但真实世界（疆域）比任何地图都复杂", "永远不要把模型当成现实本身"],
    caseStudy: "天气预报模型预测「降雨概率70%」，但它不等同于「一定会下雨」。把模型=现实，会让你在不下雨时愤怒——但模型本就没承诺确定性。",
    prompts: ["你最近一次把自己的「地图」当成了「疆域」是什么时候？","有没有一个你坚信不疑的「事实」，可能只是一张旧地图？"] },
  { id: "p05", category: "数学", catKey: "math", principle: "一个理论的前提越少，它就越接近真理", author: "欧几里得", difficulty: 2,
    breakdown: ["从最小的公理集合出发，推导出整个几何体系", "每增加一个前提，就增加了一个出错的可能", "奥卡姆剃刀的数学表达：如无必要，勿增实体"],
    caseStudy: "欧几里得只用5条公设建立了整个几何学。两千年后，数学家发现只要改第5条，就得到了完全不同的非欧几何——前提的力量。",
    prompts: ["你现在的某个判断，依赖了多少「默认前提」？","试着删掉其中一条前提，结论还成立吗？"] },
  { id: "p06", category: "系统", catKey: "systems", principle: "我们的直觉擅长线性思考，但世界是非线性的", author: "Donella Meadows", difficulty: 2,
    breakdown: ["线性：投入2倍 = 收获2倍。非线性：投入2倍 = 可能0收获，也可能100倍收获", "反馈循环放大了小的变化——复利、网络效应、口碑", "找到系统的「杠杆点」比盲目加大投入有效得多"],
    caseStudy: "亚马逊增长飞轮：更低价格更多流量更多卖家更好选品更低价格。一个正反馈循环，投入不见得翻倍，产出却指数增长。",
    prompts: ["你正在做的哪件事，可能有「非线性回报」？","找到那个正反馈循环，然后只推那个方向。"] },
  { id: "p07", category: "哲学", catKey: "philosophy", principle: "我思故我在——唯一不能怀疑的，是你正在怀疑这件事本身", author: "笛卡尔", difficulty: 2,
    breakdown: ["彻底怀疑一切：感官可能欺骗你，梦可能模仿现实", "但「我正在怀疑」这个行为本身，证明思考者存在", "这是一条不可再分解的元真理——「我」存在"],
    caseStudy: "笛卡尔从「怀疑一切」开始，发现唯一无法怀疑的就是「怀疑」这个动作本身。这就是第一性原理——找到那个你无法再往下拆的基石。",
    prompts: ["你的信念体系里，哪一条是「不可再拆」的？","试着怀疑一条你从未怀疑过的东西。会发生什么？"] },
  { id: "p08", category: "科学", catKey: "science", principle: "想象力比知识更重要", author: "爱因斯坦", difficulty: 1,
    breakdown: ["知识是已有的、已知的——它被锁在过去", "想象力可以跳到任何地方——包括从未存在过的可能性", "从第一性原理推导，需要的不是知识量，而是想象新框架的勇气"],
    caseStudy: "爱因斯坦16岁时想象「如果追上一束光，会看到什么？」这个思想实验不是靠知识——当时没人知道答案。但他跳跃到了物理学的未来。",
    prompts: ["如果规则都不存在，你会怎么做？","放下「这不可能」，问「如果可能，它会怎样？」"] },
  { id: "p09", category: "商业", catKey: "business", principle: "关注不变的东西，比追逐变化更持久", author: "Jeff Bezos", difficulty: 2,
    breakdown: ["变化吸引注意力，但「不变」才是长期战略的锚", "顾客永远想要更便宜、更快、更多选择——这三件事一百年不变", "把资源押注在不变的东西上，十年后你不会过时"],
    caseStudy: "亚马逊把所有资源投在三件事上：更低价格、更快配送、更多选品。电商形态一直在变，但这三条顾客需求从未改变。",
    prompts: ["你所处的领域里，什么东西10年后不会变？","你现在的努力，有多少投在了「不变」的东西上？"] },
  { id: "p10", category: "认知", catKey: "cognition", principle: "永远不要把你无法反驳的东西当作真理", author: "Karl Popper", difficulty: 3,
    breakdown: ["一个理论是科学的，当且仅当它是可证伪的", "不能被反驳的命题——比如「一切都是命运」——不是真理，是不可验证", "第一性原理可被检验；教条不可以"],
    caseStudy: "弗洛伊德的「无意识」理论被波普尔批评为不可证伪：无论什么行为，都可用「无意识心理」解释——但不接受反驳的理论，信息量为零。",
    prompts: ["你有一个珍惜的想法——你能说清楚，什么条件下你会放弃它吗？","如果不能，它可能是信念，不是原理。"] },
  { id: "p11", category: "数学", catKey: "math", principle: "概率不是预测——它是你在不确定世界中的认知框架", author: "Bayes / Laplace", difficulty: 3,
    breakdown: ["先验概率：在没有任何新信息时，你的初始信念", "新证据：每一条新信息按似然度更新你的信念", "后验概率：更新后的信念——这是你知道的全部"],
    caseStudy: "医生用一个测试（99%准确率）检测一种罕见病（发病率0.1%）。阳性结果意味着你患病的概率不是99%，而是约9%——因为先验概率极低。Bayes思维改变一切。",
    prompts: ["你最近做了一个判断，你的「先验概率」是什么？","你收到了什么「新证据」？更新后的概率变了吗？"] },
  { id: "p12", category: "系统", catKey: "systems", principle: "林迪效应：已经存在越久的东西，预期还会存在更久", author: "Nassim Taleb", difficulty: 1,
    breakdown: ["对于非易逝物（想法、技术、制度），过去的寿命是未来寿命的最强预测器", "一本书已出版200年仍被阅读 预期再活200年。一本刚出的畅销书 可能明年就被遗忘", "时间是最诚实的过滤器——它不关心营销预算"],
    caseStudy: "《几何原本》2300年后仍在印刷。比特币诞生14年尚未消失。一个刚融资10亿美元的AI公司——还无法判定它的林迪效应。",
    prompts: ["你最近追随的某个「趋势」，有多久的林迪效应？","你的时间投资里，有多少投在了「林迪力量强」的东西上？"] },
  { id: "p13", category: "哲学", catKey: "philosophy", principle: "人是万物的尺度", author: "普罗泰戈拉", difficulty: 2,
    breakdown: ["不存在「客观」的冷暖——冷对你来说是冷，对我可能不是", "每个人的感知构成了他们的真实。没有谁的真实更「真实」", "但这不等于「怎样都行」——逻辑仍然是共享的"],
    caseStudy: "用户体验设计的第一条原则：你不是你的用户。你觉得「明显」的按钮，对60岁阿姨可能完全不可见。不是她错了，也不是你错了——是你们的「尺度」不同。",
    prompts: ["你最近跟谁争论过？对方的「尺度」是什么？","如果假设对方的真实跟你的一样有效，你的结论会变吗？"] },
  { id: "p14", category: "科学", catKey: "science", principle: "万物的精确度有一个自然的极限——不是因为我们的仪器不够好", author: "海森堡（不确定性原理）", difficulty: 3,
    breakdown: ["在量子层面，位置和动量不能同时被精确测量", "这不仅是测量技术的局限，而是自然的本质属性", "有些东西——不确定性本身——是第一性的，不是临时的"],
    caseStudy: "不确定性原理推翻了拉普拉斯妖的幻想：即使你知道宇宙中每个粒子的当前位置，你也不可能精确预言未来。未来内在地是不确定的。",
    prompts: ["有没有一个你一直想「精确控制」的东西，本质上是不确定的？","如果接受不确定性，你的策略会怎么变？"] },
  { id: "p15", category: "商业", catKey: "business", principle: "把一件事做到极致，好过把十件事做到平庸", author: "Steve Jobs", difficulty: 1,
    breakdown: ["资源有限 分散 = 处处平庸", "第一性原理问：什么是最重要的一件？", "对其它1000件事说「不」，是集中能量的前提"],
    caseStudy: "Jobs 1997年回苹果时砍掉了70%的产品线，只留四个象限：消费/专业  台式/便携。集中力量做四种极致产品，而不是几十种平庸机型。",
    prompts: ["你的工作/生活里，正在做多少件「还行」的事？","如果只能留一件，哪一件？为什么它值得？"] },
  { id: "p16", category: "哲学", catKey: "philosophy", principle: "未经审视的人生不值得过", author: "苏格拉底", difficulty: 1,
    breakdown: ["「审视」意味着追问每一个信念的来源", "大多数人一辈子都在过「二手人生」——别人的价值观，别人的目标", "第一性原理要求你重新审视：我真正想要的是什么？"],
    caseStudy: "苏格拉底每天在雅典广场问路人问题，逼他们反思自己深信不疑的东西。大多数人的回答经不起三句追问——于是他成了「最智慧的人」，因为他知道自己无知。",
    prompts: ["你最近做的哪个重大决定，是「别人都这么做」所以你也这么做的？","如果抛开所有人的期望，你会做什么不同的事？"] },
  { id: "p17", category: "哲学", catKey: "philosophy", principle: "存在即被感知", author: "贝克莱", difficulty: 2,

    caseStudy: "现代物理学的「观察者效应」呼应了贝克莱：在量子层面，观测行为本身改变了被观测对象。存在与感知，界限比想象的模糊。",
    prompts: ["什么东西你坚信「客观存在」，但从未直接感知过？","如果你对某个问题的全部认知都来自二手信息——你还能说「知道」吗？"] },
  { id: "p18", category: "哲学", catKey: "philosophy", principle: "人不能两次踏进同一条河流", author: "赫拉克利特", difficulty: 1,

    caseStudy: "柯达发明了数码相机但拒绝拥抱它，因为胶卷太赚钱了。它试图两次踏进「同一条河流」，结果被河流冲走。",
    prompts: ["你上一次抗拒某个变化是什么时候？后来回头看，那个变化是好是坏？","如果「变化」是唯一确定的事，你的长期计划需要怎么调整？"] },
  { id: "p19", category: "科学", catKey: "science", principle: "简单是复杂的极致", author: "达芬奇", difficulty: 1,
    breakdown: ["简单的公式往往有巨大的解释力——E=mc² 只有五个字符", "复杂性通常是多个简单原理叠加的结果", "把事情搞复杂很容易；还原成简单需要真功夫"],
    caseStudy: "牛顿用三条定律解释了从苹果落地到行星轨道的全部运动。两百年后爱因斯坦说「尽可能简单，但不要太简单」。",
    prompts: ["你最近有没有把简单的事情想复杂了？","选一个困扰你的问题，用一句话把它说清楚。"] },
  { id: "p20", category: "科学", catKey: "science", principle: "科学的本质不是相信，而是质疑", author: "伽利略", difficulty: 2,
    breakdown: ["亚里士多德说重物下落更快——所有人都信了1900年", "伽利略没有「相信」——他在比萨斜塔上扔了两个球", "第一性原理不是知道答案，而是拒绝接受未经检验的答案"],
    caseStudy: "伽利略用望远镜看到木星的卫星后，推翻了「所有天体都绕地球转」的千年教条。教会威胁烧死他——他撤回公开声明，但私下继续研究。",
    prompts: ["你有一个「常识」级别的信念，从未亲自验证过——是什么？","如果你只能通过实验来相信一件事，你会怎么设计那个实验？"] },
  { id: "p21", category: "科学", catKey: "science", principle: "上帝不掷骰子", author: "爱因斯坦", difficulty: 3,
    breakdown: ["爱因斯坦无法接受量子力学的随机性——他认为一定有更深层的规律", "波尔回应：「爱因斯坦，别告诉上帝该做什么」", "第一性原理的分歧：不确定性到底是临时的无知，还是宇宙的固有属性？"],
    caseStudy: "爱因斯坦花了后半生寻找「统一场论」——试图用一个框架解释所有物理现象。他失败了。但贝尔不等式实验证实了量子随机性是真实的，不是临时的。",
    prompts: ["有没有一个你坚信的「深层规律」，可能根本不存在？","你怎么区分「真正的规律」和「我想要的规律」？"] },
  { id: "p22", category: "商业", catKey: "business", principle: "消费者不知道他们想要什么，直到你给他们看", author: "亨利·福特", difficulty: 1,
    breakdown: ["如果你问19世纪的人要什么交通工具——他们会说「更快的马」", "第一性原理不是问用户要什么，而是看用户缺什么", "汽车不是「更快的马」——它是完全不同的物种"],
    caseStudy: "iPhone发布前，没人说「我想要一块无键盘的玻璃板」。但乔布斯知道，人们缺的不是更好的键盘手机，而是人与数字世界交互的新方式。",
    prompts: ["你正在做的产品，是在做「更快的马」还是「汽车」？","试着不问你的用户他们要什么——观察他们哪里最不方便。"] },
  { id: "p23", category: "商业", catKey: "business", principle: "战略不是「做什么」，而是「不做什么」", author: "Michael Porter", difficulty: 2,
    breakdown: ["好的战略 = 做取舍。你不能在所有维度都赢", "「不做什么」比「做什么」更难——因为它意味着放弃机会", "第一性原理帮你找到：在这个竞争格局中，我唯一不可替代的价值是什么？"],
    caseStudy: "宜家选择不做高端、不做定制、不做组装、不提供配送。每一个「不做」都让它在「便宜可组装」这个维度上无人可敌。",
    prompts: ["你的产品/技能组合里，哪一项是你真正不可替代的？","你最近拒绝了什么「好机会」？如果没有拒绝任何东西，你的战略可能还不够清晰。"] },
  { id: "p24", category: "商业", catKey: "business", principle: "做难而正确的事", author: "左晖（贝壳找房创始人）", difficulty: 1,
    breakdown: ["「正确」来自第一性原理——这件事本质上对吗？", "「难」意味着做的人少——这是你的护城河", "大部分人会选「容易」和「正确」的交集——那意味着拥挤"],
    caseStudy: "贝壳坚持「真房源」——不做假房源引流。十年里同行都说他们傻。但当用户发现只有贝壳不骗人时，品牌壁垒已经牢不可破。",
    prompts: ["你现在做的工作里，有没有哪个部分因为是「难的」所以你在回避？","如果五年后回头看，你今天回避的那个「难」会怎么影响你？"] },
  { id: "p25", category: "认知", catKey: "cognition", principle: "确认偏误：我们只看到我们想看到的", author: "Peter Wason（心理学家）", difficulty: 1,
    breakdown: ["人类天然倾向于寻找支持自己观点的证据，忽略反面证据", "这不是智力问题——这是大脑的出厂设置", "对抗确认偏误的唯一方法：主动寻找「反面证据」"],
    caseStudy: "Wason实验：给被试者一组数字「2, 4, 6」，让他们猜规则。大多数人猜「连续偶数」，然后只测试符合这个想法的序列。很少有人测试「1, 3, 5」来推翻自己。",
    prompts: ["你最近在坚持的一个观点——能不能列举三条反对它的证据？","如果你必须为对手的立场辩护，你会怎么说？"] },
  { id: "p26", category: "认知", catKey: "cognition", principle: "沉没成本不是成本", author: "经济学基本原理", difficulty: 1,
    breakdown: ["已经花掉的时间和钱，不应该影响未来的决策", "「我都做了这么久了，放弃太可惜」——这个想法本身就是陷阱", "第一性原理只关心：从今天开始，最优选择是什么？"],
    caseStudy: "英法两国合作开发协和式超音速客机，项目中期已经知道商业上不可行——但两国政府已经花了巨额资金，谁也不想先退出。结果又花了三倍的钱造出一架没人买的飞机。",
    prompts: ["有没有一件你还在坚持的事，只是因为「已经投入太多」？","如果今天是你从零开始做这个决定，你还会选它吗？"] },
  { id: "p27", category: "认知", catKey: "cognition", principle: "汉隆剃刀：能用愚蠢解释的，不要用恶意解释", author: "Robert J. Hanlon", difficulty: 1,
    breakdown: ["别人做了让你愤怒的事——你的第一反应是「他是故意的」", "但大部分情况下，对方只是没注意、忘了、不懂", "假设恶意会让你愤怒；假设愚蠢会让你解决问题"],
    caseStudy: "同事没回你的消息——可能是故意的（恶意），也可能是忙忘了（愚蠢）。如果是恶意，你需要对抗；如果是愚蠢，你只需要再发一条。后者的成本低得多。",
    prompts: ["你最近跟谁生气过？如果假设对方不是故意的，你的反应会有什么不同？","遇到冲突时，你在几秒内就开始归因「恶意」？"] },
  { id: "p28", category: "数学", catKey: "math", principle: "零是所有数字中最重要的发明", author: "古印度数学家", difficulty: 2,
    breakdown: ["没有「零」，就没有位置记数法——你把101和11混为一谈", "零不仅是「没有」——它是数学的基准点", "第一性原理：找到某个领域的「零」——即基准状态——是理解一切的起点"],
    caseStudy: "在零被发明之前，欧洲人用罗马数字做乘法极其痛苦。印度人带来了零和十进制，让数学运算从只有精英能做的事变成了每个商人都能做的事。",
    prompts: ["你的领域里的「零」是什么？那个基准状态是什么？","如果把你现在的所有假设归零，只从三个基本事实开始，你得到什么？"] },
  { id: "p29", category: "数学", catKey: "math", principle: "无穷大不是一个大数，它是一类全新的概念", author: "康托尔（集合论创始人）", difficulty: 3,
    breakdown: ["有些无穷大比另一些无穷大更大——这听起来荒谬但数学上为真", "整数有无限个，实数也有无限个——但实数的无限比整数的无限「大」", "不要用已有框架理解全新概念——先接受它，再理解它"],
    caseStudy: "康托尔提出「不同大小的无穷大」时，他的导师称他为「科学的叛徒」。数学界花了30年才接受——今天它是集合论的基础。",
    prompts: ["你是否有过——面对一个全新概念时先用旧框架去套，结果完全误读了它？","如果从零开始接受某个你排斥的「荒谬」想法，它会带来什么新洞察？"] },
  { id: "p30", category: "数学", catKey: "math", principle: "Garbage in, garbage out——模型的输出永远不可能比输入更好", author: "计算机科学格言", difficulty: 1,
    breakdown: ["数学不能魔法般地纠正错误的前提", "一个正确的推理 + 一个错误的前提 = 一个看似正确但完全错误的结论", "第一性原理的警示：先检查你的前提，再检查你的推理"],
    caseStudy: "2008年金融危机：华尔街的数学模型精确无比——但前提假设「房价不会全国性下跌」是错误的。错误的输入 + 精确的数学 = 灾难性的输出。",
    prompts: ["你最近做了一个「逻辑无懈可击」的分析——但它的前提是什么？","如果前提错了，你的结论还站得住吗？"] },
  { id: "p31", category: "系统", catKey: "systems", principle: "蝴蝶效应：初始条件的微小差异可以导致完全不同的结果", author: "Edward Lorenz", difficulty: 2,
    breakdown: ["非线性系统对初始条件极度敏感", "不是蝴蝶扇翅膀「导致」了飓风——而是系统本身就不可精确预测", "长期天气预报不可靠不是因为技术差，而是因为系统的天然属性"],
    caseStudy: "Lorenz在1961年重新运行天气模拟时，为了节省时间输入了四舍五入后的初始值（0.506而非0.506127）。结果模拟出的天气模式完全不同——他发现了混沌理论。",
    prompts: ["你有没有因为「差一点点」而放弃了某件事？那个「一点点」在非线性世界里可能被放大多少倍？","你的生活中，哪个选择「看似微小」但事后发现改变了整个人生轨迹？"] },
  { id: "p32", category: "系统", catKey: "systems", principle: "边际效用递减：第六个馒头的价值远不如第一个", author: "经济学基本原理", difficulty: 1,
    breakdown: ["每增加一单位投入，产出的增量越来越少", "不是因为投入质量下降了——而是因为你已经「吃饱了」", "第一性原理的决策原则：比较的是「增量」，不是「总量」"],
    caseStudy: "你渴的时候，第一杯水价值连城。第五杯水可能一文不值。同样的水，同样的你——但因为「存量」不同，效用天差地别。这对定价、分配、时间管理都适用。",
    prompts: ["你现在投入最多的事情，是在第几个「馒头」上？","哪些地方你已经「吃饱了」但还在继续加码？"] },
  { id: "p33", category: "系统", catKey: "systems", principle: "盖尔定律：一个有效的复杂系统必然是从一个有效的简单系统演化而来的", author: "John Gall", difficulty: 2,
    breakdown: ["不要试图一次性设计一个复杂系统——它不会工作的", "从最简单可行的版本开始，让它自然生长", "如果你看到一个「一开始就很复杂」的成功系统——你看到了假历史"],
    caseStudy: "Facebook不是从「全世界最大的社交网络」的设计稿开始的——它从一个只支持哈佛学生的简陋页面起步。Twitter最初只是短信群发。Amazon最初只卖书。",
    prompts: ["你正在设计的某个东西，是不是「太复杂了」很难下手？","如果先做它能在一个周末完成的最小版本，那个版本长什么样？"] },
  { id: "p34", category: "哲学", catKey: "philosophy", principle: "必须从地基重建——想在旧地基上嫁接新东西，科学就不会有大进步", author: "弗朗西斯·培根（《新工具》）", difficulty: 2,
    breakdown: ["三段论触及不到第一性原理——它只能让人同意命题，却不能抓住事物本身", "现有概念（实体、质、作用……）本身是腐败的、定义不清的", "真正的路：从感觉和具体出发，一步一步上升，最后才到达最一般的公理"],
    caseStudy: "培根在1620年指出，科学停滞不是因为人们不够聪明，而是因为方法错了——从亚里士多德继承的概念框架本身就是歪的。四百年后，Musk 说同样的话：不要用类比，从第一性原理重建。",
    prompts: ["你现在用的某个「基本概念」，你确定它的定义是牢靠的吗？","如果让你从零开始重新定义你的领域，你会扔掉哪三个「常识」？"] },
  { id: "p35", category: "哲学", catKey: "philosophy", principle: "我们不能以先验的知识证明未来就会和过去一致", author: "大卫·休谟", difficulty: 3,
    breakdown: ["「太阳明天会升起」——你凭什么这么确定？因为你见过它每天升起", "但「过去重复」本身无法被证明——它只是一个心理习惯", "休谟拆掉了因果律的根基：因果关系只是恒常相连，不是逻辑必然"],
    caseStudy: "2008年金融危机前，所有模型都假设房价「像过去一样」只涨不跌。休谟在1739年就警告过：过去一致不代表未来一致——但没人听。",
    prompts: ["你有一个「一直如此」的信念——除了「一直如此」外，还有什么证据？","如果明天某个「规律」突然失效，你的生活会怎样？"] },
  { id: "p36", category: "哲学", catKey: "philosophy", principle: "道生一，一生二，二生三，三生万物", author: "老子《道德经》", difficulty: 2,
    breakdown: ["道是宇宙的第一因——不可说、不可名，但一切从它开始", "从简单到复杂的演化逻辑：一→二→三→万物", "「反者道之动」——循环往复是道运作的方式。万物从底层来，最终回归底层"],
    caseStudy: "「道法自然」四个字是终极的第一性原理——道的法则就是「自然」，即系统自组织的规律。这不是神秘主义，而是对复杂系统涌现行为最古老的洞察。",
    prompts: ["你的工作/生活中，有没有什么事情是「越做越复杂」而忘了最初的「一」？","如果回到你的「一」，你会砍掉什么？"] },
  { id: "p37", category: "哲学", catKey: "philosophy", principle: "心即理也。天下又有心外之事、心外之理乎？", author: "王阳明", difficulty: 2,
    breakdown: ["心即理——心是宇宙万物的价值本源。不是「心里有道理」，而是「心本身就是理」", "知行合一——知是行的开始，行是知的完成。真知必然导致行动", "致良知——把内心的良知推致到万事万物上"],
    caseStudy: "王阳明被贬到贵州龙场，在绝境中悟到：圣人之道不在外面，而在自己心里。他后来平定宁王之乱只用43天——不是靠兵多，是靠「此心不动，随机而动」。",
    prompts: ["你有什么「知道该做但一直没做」的事？按王阳明的标准，你不是真知道。","你最近一次「心动了」导致判断失误是什么时候？"] },
  { id: "p38", category: "哲学", catKey: "philosophy", principle: "人人自有定盘针，万化根源总在心", author: "王阳明（咏良知诗）", difficulty: 1,
    breakdown: ["每个人内心都有一个定盘针——良知——不需要外求", "「却笑从前颠倒见，枝枝叶叶外头寻」——在外面找答案是本末倒置", "第一性原理不是向外寻找更深的规律，而是向内澄明自己的本心"],
    caseStudy: "阳明心学四句教：无善无恶是心之体 → 有善有恶是意之动 → 知善知恶是良知 → 为善去恶是格物。这四步构成了从本体到实践的第一性原理完整链条。",
    prompts: ["你最近在「外头寻」什么？如果答案在你心里，它会是什么？","有没有一个决策，你其实内心知道答案，但不敢承认？"] },
  { id: "p39", category: "商业", catKey: "business", principle: "你无论把多少辆马车连续相加，也绝无可能出现一辆火车", author: "约瑟夫·熊彼特", difficulty: 1,
    breakdown: ["量变不会自动产生质变——把旧东西做得更好，不等于创造新东西", "创新是「新组合」——旧要素的重新排列和连接", "第一性原理不关心优化马车，它问：交通的本质是什么？"],
    caseStudy: "iPhone 不是「更好的手机」——它是「口袋里的电脑」。把键盘手机做到极致（Nokia N97）的结果是被彻底淘汰。马车的极致还是马车。",
    prompts: ["你正在做的事，是在优化「马车」还是发明「火车」？","如果「火车」今天已经存在了，你做的「马车」还有价值吗？"] },
  { id: "p40", category: "商业", catKey: "business", principle: "马斯克五步工作法", author: "Elon Musk", difficulty: 1,
    breakdown: ["1. 不要有愚蠢的需求——先质疑每一个需求是否真的必要", "2. 删除不必要的部分——能删就删，别手软", "3. 在前两步的基础上优化——别优化一个本来就该被删除的东西", "4. 加速——在正确的事情上加快", "5. 自动化——最后才考虑自动化"],
    caseStudy: "SpaceX造火箭时，很多「行业标准」的零件其实不需要。一个阀门市场价$25万，拆解后发现用$5000就能自己造。先是质疑需求（真的需要那个阀门吗？），再是删减，再优化。",
    prompts: ["你正在做的项目里，有没有哪一步是「因为大家这么做」所以你也做？","试着一个一个砍掉非必要的步骤——砍到只剩核心，还剩什么？"] },
  { id: "p41", category: "商业", catKey: "business", principle: "刷新：每一个人、每一个组织，在到达某一个点时，都应该点击刷新", author: "萨提亚·纳德拉（微软CEO）", difficulty: 2,
    breakdown: ["Windows既是光环也是枷锁——卸下它才能走得更远", "从「自以为是」（Know-it-all）到「学习一切」（Learn-it-all）", "同理心不是软技能——它是创新与领导力的核心"],
    caseStudy: "纳德拉接手微软时，微软市值不到3000亿美元，内部各自为战。他把公司基石从「每桌一台PC」下沉到「赋能每一人」，并推动全员从「证明自己知道」变成「证明自己能学」。在他任期内微软突破3万亿。",
    prompts: ["你身上有没有某个曾经的「光环」，现在变成了「枷锁」？","你最近一次承认「我不懂」是什么时候？如果不记得——你是不是在假装全知？"] },
  { id: "p42", category: "商业", catKey: "business", principle: "如果你要创新，你必须愿意长时间被误解", author: "Jeff Bezos", difficulty: 2,
    breakdown: ["创新 = 非共识 + 正确。如果所有人都同意你，你就没有超额回报", "「长时间被误解」意味着你可能对了好几年但没人信你", "第一性原理给了你坚持的底气——你不是在瞎赌，你是在从真理推导"],
    caseStudy: "AWS在2006年推出时，华尔街一致认为亚马逊「不务正业」。连续6年被嘲笑。到2015年，AWS贡献了亚马逊一半以上的利润。Bezos知道自己是对的——因为「企业不想自建数据中心」这个真理100年不变。",
    prompts: ["有没有一个你的观点，大多数人不以为然——但你是对的？","如果你确信一件事从第一性原理推导出来是对的，但所有人反对——你能坚持多久？"] },
  { id: "p43", category: "商业", catKey: "business", principle: "什么重要的真理，只有很少人同意你？", author: "Peter Thiel", difficulty: 2,
    breakdown: ["这是Thiel最好的面试题——直接测试第一性原理思维能力", "大多数人能说的都是「大家同意但我不说」或「没人同意但也不重要」", "找到一个「重要但非共识的真理」= 找到了从0到1的种子"],
    caseStudy: "2004年，Thiel问创业者：「有什么你相信但大多数人觉得荒谬的事？」Mark Zuckerberg说：「每个人都会在网上分享一切。」当时所有人都觉得荒谬——今天这成了几十亿人的日常。",
    prompts: ["你的回答是什么？什么重要的真理，很少人同意你？","如果你一个都说不出来——是不是因为你从未真正独立思考过？"] },
  { id: "p44", category: "认知", catKey: "cognition", principle: "如果哪一年你没有破坏至少一个你最爱的观念，那么你这一年就算白过了", author: "查理·芒格", difficulty: 1,
    breakdown: ["最爱的观念 = 你最珍视的信念——也是最危险的盲点", "主动「破坏」自己的观念，是防止僵化的唯一方式", "这不是怀疑一切，而是把最珍视的观念定期拿出来检查"],
    caseStudy: "芒格和巴菲特早年只投「烟蒂股」——便宜但平庸的公司。芒格花了好几年时间说服巴菲特「破坏」这个观念，转向「以合理价格买伟大公司」。没有这个自我推翻，就没有后来的伯克希尔。",
    prompts: ["你今年破坏了自己哪个「最爱的观念」？","如果让你选一个你最珍视的信念，然后主动找证据推翻它——你会从哪里开始？"] },
  { id: "p45", category: "认知", catKey: "cognition", principle: "如果你手中只有一把锤子，你满世界看到的都是钉子", author: "查理·芒格（多元思维模型）", difficulty: 1,
    breakdown: ["单一学科思维 = 用同一个工具解决所有问题 = 锤子人", "多元思维模型：从各个学科提取最核心的思维框架，组合使用", "第一性原理不是一把万能锤——它是让你知道什么时候该换工具"],
    caseStudy: "芒格说：「如果你只有经济学思维，你会用供求解释一切。但加上心理学，你会发现人根本不理性。加上生物学，你会发现竞争和合作是演化驱动的。加上物理，你会理解临界点和相变。」",

  { id: "p46", category: "认知", catKey: "cognition", principle: "很多人宁可死，也不愿意独立思考", author: "伯特兰·罗素", difficulty: 1,
    breakdown: ["独立思考是痛苦的——它意味着你要独自承担责任", "从众是温暖的——错了也是大家一起错", "第一性原理思维的本质代价：你必须愿意「一个人站在对的一边」"],
    caseStudy: "所罗门·阿希的从众实验：当一群演员故意说B线段比A长时（明显错误），75%的被试者至少有一次放弃了自己的正确判断，跟随了群体的错误答案。",

  { id: "p47", category: "认知", catKey: "cognition", principle: "群体追求和相信的从来不是什么真相和理性", author: "古斯塔夫·勒庞《乌合之众》", difficulty: 2,
    breakdown: ["群体不需要真理——群体需要情绪共振和简单结论", "人在群体中智商会下降——不是因为变笨了，而是因为理性被情绪淹没了", "第一性原理的反面教材：群体思维是典型的类比思维——「大家都信，所以是真的」"],
    caseStudy: "1637年荷兰郁金香狂热：一株郁金香球茎炒到相当于一栋豪宅的价格。所有人都在买，所有人都说「还会涨」。不是因为有谁知道郁金香的价值——只是因为「别人都在买」。",
    prompts: ["你当前跟随的哪个「共识」，可能只是群体情绪而非真理？","如果明天所有人突然反过来——你今天的选择还站得住吗？"] },
  { id: "p48", category: "认知", catKey: "cognition", principle: "永远不要浪费一场好危机", author: "温斯顿·丘吉尔", difficulty: 1,
    breakdown: ["危机是旧系统崩溃的时刻——也是新系统最容易建立的时刻", "平时改不掉的惯性，在危机中自然瓦解", "第一性原理的应用窗口：当旧规则失效时，正是从零重建的最佳时机"],
    caseStudy: "2008年金融危机后，Airbnb和Uber崛起——不是因为它们突然变聪明了，而是因为千万人失去了收入和房子，必须接受「陌生人住你家」和「陌生人载你」这些在正常时期被抵制的新模式。",
    prompts: ["你经历过的最大的「危机」，回头看是不是你成长最快的时期？","如果把你今天最大的烦恼当作一个「重新设计」的机会——你会设计什么？"] },
  { id: "p49", category: "科学", catKey: "science", principle: "我不能创造的，我就没有真正理解", author: "理查德·费曼", difficulty: 2,
    breakdown: ["看懂了 能讲清楚 能创造出来——这是理解的三个层次", "如果你不能从零构建一个东西，你对它的理解就有漏洞", "第一性原理的终极检验：你能不能从基本原理开始推导出结论？"],
    caseStudy: "费曼在教量子力学时发现：他不能从基本原理推导出某些结论的地方，正是物理学的前沿——那些地方连物理学家也还没真正理解。教学的诚实逼出了科学的诚实。",
    prompts: ["选一个你以为自己理解的概念——试着不用任何术语，从零解释它。","你在哪个地方开始说不下去了？那可能就是你的「理解边界」。"] },
  { id: "p50", category: "科学", catKey: "science", principle: "科学就是相信专家也是无知的", author: "理查德·费曼", difficulty: 1,
    breakdown: ["同行评审不保证正确——只保证「看起来没明显错误」", "「因为专家说的」不是论证——它是诉诸权威的谬误", "第一性原理不关心头衔——只关心从真理出发的逻辑链是否成立"],
    caseStudy: "1900年，开尔文勋爵（物理学界最权威的声音）宣布「物理学的大厦已经建成，只剩下两朵乌云」。那两朵「乌云」后来变成了相对论和量子力学——彻底推翻了整个大厦。",
    prompts: ["你最近有没有因为「某个权威这么说」就接受了某个结论？","如果那个权威只是刚好声音大的人——而非对的人——你的判断会变吗？"] },
  { id: "p51", category: "数学", catKey: "math", principle: "花半秒钟就看透事物本质的人，和花一辈子都看不清的人，注定是截然不同的命运", author: "《教父》", difficulty: 1,
    breakdown: ["本质 ≠ 表象。大多数人一辈子在表象上奔波", "看透本质不是天赋——是可以训练的第一性原理思维习惯", "「半秒钟」的背后是无数次刻意思考：不断追问「这背后是什么」"],
    caseStudy: "Pareto Principle（二八定律）：20%的客户贡献80%的收入，20%的bug造成80%的崩溃，20%的习惯决定80%的健康。看透这个本质的人把精力放在20%上；看不懂的人平均用力，累死不见效。",
    prompts: ["你当前最忙的事情里，哪20%贡献了80%的价值？","如果只留那20%，你会失去什么，又会得到什么？"] },
  { id: "p52", category: "系统", catKey: "systems", principle: "同一层面的问题，不可能在同一个层面解决，只有在高于它的层面才能解决", author: "爱因斯坦", difficulty: 2,
    breakdown: ["问题本身就是一个系统——你在系统内部打转，永远解决不了", "你需要跳出系统——打破隐含假设，从更高的维度看", "这是「破界创新」的核心：破隐含假设→立新基石→见新系统"],
    caseStudy: "交通拥堵问题：更多马路→更多人买车→更堵（同一层面解决失败）。真正的解决来自更高层面——远程办公（不产生交通需求）、拥堵费（重新定价道路使用权）、无人驾驶共享（改变车辆利用率）。",
    prompts: ["你正在「解决」但一直没有解决的某个问题——你有没有尝试跳出问题所在的层面？","如果能「升维」看这个问题——比如从时间维度、系统维度、人性维度——它长什么样？"] },
  { id: "p53", category: "系统", catKey: "systems", principle: "把知识看作一棵语义树：先理解树干和大树枝，再进入树叶，否则树叶无处可挂", author: "Elon Musk", difficulty: 1,
    breakdown: ["大多数人学习是从树叶开始的——学了一堆细节但不知道框架", "树干 = 基本原理。大树枝 = 核心概念。树叶 = 具体细节", "第一性原理的学习方法：先问「这个领域最根本的几条真理是什么」，再往下学"],
    caseStudy: "Musk学火箭科学时，没有去读「火箭制造指南」。他先啃了几本火箭物理学的教科书——理解了推进、结构、燃料的基本原理（树干），然后才看具体型号和零件（树叶）。两年后他比大多数航天工程师更懂火箭。",
    prompts: ["你正在学习的东西——你知道它的「树干」是什么吗？","如果只能用三句话解释你的领域——你会说哪三句？"] }
];

var CATEGORIES = [
  { key: "all",       label: "全部" },
  { key: "philosophy", label: "哲学" },
  { key: "science",    label: "科学" },
  { key: "business",   label: "商业" },
  { key: "cognition",  label: "认知" },
  { key: "math",       label: "数学" },
  { key: "systems",    label: "系统" },
];

var cards = [];
var currentIndex = 0;
var activeFilter = "all";
var isTransitioning = false;
var dragStart = null;
var dragOffset = { x: 0, y: 0 };
var dragLocked = false;

var stack = document.getElementById("stack");
var activeCard = document.getElementById("active-card");
var peekCard = document.getElementById("peek-card");
var progressFill = document.getElementById("progress-fill");
var cardPos = document.getElementById("card-pos");
var pickerOverlay = document.getElementById("picker-overlay");
var pickerSheet = document.getElementById("picker-sheet");

function buildDeck() {
  var pool = activeFilter === "all" ? ALL_CARDS : ALL_CARDS.filter(function(c) { return c.catKey === activeFilter; });
  // Shuffle
  var arr = pool.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function resetSession() {
  cards = buildDeck();
  currentIndex = 0;
  dragOffset = { x: 0, y: 0 };
  isTransitioning = false;
  updateUI();
  renderChips();
}

function renderCard(el, card) {
  if (!card) { el.innerHTML = ""; return; }
  var bdHtml = card.breakdown.map(function(s, i) {
    return '<div class="bd-step">' + (i+1) + '. ' + s + '</div>';
  }).join("");

  var NUMS = ['①','②','③'];
  var promptsHtml = card.prompts.map(function(q, i) {
    return '<div class="refl-q"><span class="idx">' + (NUMS[i] || (i+1)) + '</span>' + q + '</div>';
  }).join("");

  el.innerHTML =
    '<div class="card-quote">' +
      '<div class="quote-text">' + card.principle + '</div>' +
      '<div class="quote-author">' + card.author + '</div>' +
    '</div>' +
    '<div class="card-breakdown">' +
      '<div class="bd-label"> 第一性拆解</div>' +
      '<div class="bd-steps">' + bdHtml + '</div>' +
    '</div>' +
    '<div class="card-case">' +
      '<div class="case-label"> 案例</div>' +
      '<div class="case-text">' + card.caseStudy + '</div>' +
    '</div>' +
    '<div class="card-reflect">' +
      '<div class="refl-label"> 反思</div>' +
      promptsHtml +
    '</div>';
}

function updateUI() {
  if (cards.length === 0) {
    activeCard.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--secondary);font-size:18px;">没有符合条件的卡片</div>';
    peekCard.innerHTML = "";
    progressFill.style.width = "0%";
    cardPos.textContent = "0/0";
    return;
  }
  renderCard(activeCard, cards[currentIndex]);
  var next = currentIndex + 1 < cards.length ? cards[currentIndex + 1] : null;
  if (next && !isTransitioning) {
    renderCard(peekCard, next);
    peekCard.style.display = "";
  } else {
    peekCard.style.display = "none";
  }
  progressFill.style.width = ((currentIndex + 1) / cards.length * 100) + "%";
  cardPos.textContent = (currentIndex + 1) + "/" + cards.length;
  activeCard.style.transform = "translate(" + dragOffset.x + "px, " + dragOffset.y + "px) rotate(" + (dragOffset.x / 24) + "deg)";
}

function renderChips() {
  var html = "";
  CATEGORIES.forEach(function(c) {
    html += '<button class="' + (activeFilter === c.key ? 'on' : '') + '" data-key="' + c.key + '">' + c.label + '</button>';
  });
  pickerSheet.innerHTML = html;
  pickerSheet.querySelectorAll("button").forEach(function(btn) {
    btn.addEventListener("click", function() {
      activeFilter = btn.dataset.key;
      pickerOverlay.classList.remove("show");
      resetSession();
    });
  });
}

cardPos.addEventListener("click", function() {
  renderChips();
  pickerOverlay.classList.add("show");
});

pickerOverlay.addEventListener("click", function(e) {
  if (e.target === pickerOverlay) pickerOverlay.classList.remove("show");
});

// ── Gesture ──
function getPos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onStart(e) {
  if (isTransitioning || cards.length === 0) return;
  var p = getPos(e);
  dragStart = { x: p.x, y: p.y, cardX: dragOffset.x, cardY: dragOffset.y };
  dragLocked = false;
}

function onMove(e) {
  if (!dragStart) return;
  var p = getPos(e);
  var dx = p.x - dragStart.x;
  var dy = p.y - dragStart.y;

  if (!dragLocked) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
      dragLocked = true;
      activeCard.style.transition = "none";
    } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
      dragStart = null;
      return;
    } else {
      return;
    }
  }

  e.preventDefault();
  dragOffset.x = dragStart.cardX + dx;
  dragOffset.y = 0;
  activeCard.style.transform = "translate(" + dragOffset.x + "px, 0px) rotate(" + (dragOffset.x / 24) + "deg)";
}

function onEnd(e) {
  if (!dragStart) return;
  if (!dragLocked) {
    dragOffset.x = 0; dragOffset.y = 0;
    activeCard.style.transition = "transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)";
    activeCard.style.transform = "translate(0, 0) rotate(0deg)";
    dragStart = null;
    return;
  }

  var dx = dragOffset.x - dragStart.cardX;
  var absX = Math.abs(dx);
  var threshold = 60;

  if (absX < threshold) {
    dragOffset.x = 0; dragOffset.y = 0;
    activeCard.style.transition = "transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)";
    activeCard.style.transform = "translate(0, 0) rotate(0deg)";
    dragStart = null;
    return;
  }

  var flyX = Math.max(stack.getBoundingClientRect().width, 500);
  var toIndex = currentIndex;

  if (dx < 0 && currentIndex < cards.length - 1) toIndex = currentIndex + 1;
  else if (dx > 0 && currentIndex > 0) toIndex = currentIndex - 1;

  if (toIndex !== currentIndex) {
    var goingForward = toIndex > currentIndex;
    var exitX = goingForward ? -flyX : flyX;
    animatePageTurn(toIndex, exitX, 0, goingForward);
  } else {
    dragOffset.x = 0; dragOffset.y = 0;
    activeCard.style.transition = "transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)";
    activeCard.style.transform = "translate(0, 0) rotate(0deg)";
  }
  dragStart = null;
}

activeCard.addEventListener("mousedown", onStart);
activeCard.addEventListener("touchstart", onStart, { passive: false });
window.addEventListener("mousemove", function(e) { if (dragStart) onMove(e); });
window.addEventListener("touchmove", function(e) { if (dragStart) onMove(e); }, { passive: false });
window.addEventListener("mouseup", onEnd);
window.addEventListener("touchend", onEnd);

// ── Animation ──
function animatePageTurn(toIndex, exitX, exitY, goingForward) {
  isTransitioning = true;
  peekCard.style.display = "none";

  dragOffset.x = exitX;
  dragOffset.y = exitY;
  activeCard.style.transition = "transform 0.22s ease-out";
  activeCard.style.transform = "translate(" + exitX + "px, " + exitY + "px) rotate(" + (exitX / 24) + "deg)";

  setTimeout(function() {
    currentIndex = toIndex;
    var enterX = -exitX;
    var enterY = -exitY;
    dragOffset.x = enterX;
    dragOffset.y = enterY;
    activeCard.style.transition = "none";
    activeCard.style.transform = "translate(" + enterX + "px, " + enterY + "px) rotate(" + (enterX / 24) + "deg)";

    activeCard.offsetHeight;

    requestAnimationFrame(function() {
      renderCard(activeCard, cards[currentIndex]);
      dragOffset.x = 0;
      dragOffset.y = 0;
      activeCard.style.transition = "transform 0.42s cubic-bezier(0.25, 0.1, 0.1, 1)";
      activeCard.style.transform = "translate(0, 0) rotate(0deg)";
      progressFill.style.width = ((currentIndex + 1) / cards.length * 100) + "%";
      cardPos.textContent = (currentIndex + 1) + "/" + cards.length;
    });

    setTimeout(function() {
      isTransitioning = false;
      updateUI();
    }, 450);
  }, 230);
}

// ── Keyboard ──
window.addEventListener("keydown", function(e) {
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (!isTransitioning && currentIndex < cards.length - 1) {
      var fly = Math.max(stack.getBoundingClientRect().width || 400, 500);
      animatePageTurn(currentIndex + 1, -fly, 0, true);
    }
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    if (!isTransitioning && currentIndex > 0) {
      var fly = Math.max(stack.getBoundingClientRect().width || 400, 500);
      animatePageTurn(currentIndex - 1, fly, 0, false);
    }
  }
});

resetSession();
</script>
</body>
</html>
